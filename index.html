<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO Stream & Deep House Radio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Эффект цветомузыки по бокам */
        .music-visualizer-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .music-visualizer-bg.active {
            opacity: 1;
            animation: colorPulse 2s infinite alternate ease-in-out;
        }

        @keyframes colorPulse {
            0% {
                box-shadow: inset 150px 0 120px rgba(0, 255, 136, 0.4), inset -150px 0 120px rgba(255, 0, 128, 0.4);
            }
            100% {
                box-shadow: inset 200px 0 180px rgba(0, 212, 255, 0.6), inset -200px 0 180px rgba(120, 0, 255, 0.6);
            }
        }

        /* Кнопка радио в левом верхнем углу (Листок марихуаны) */
        .radio-top-btn {
            position: fixed !important;
            top: 15px !important;
            left: 15px !important;
            z-index: 9999999 !important;
            width: 48px;
            height: 48px;
            background: #14141a;
            border: 2px solid #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            transition: 0.3s;
        }

        .radio-top-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.7);
        }

        .radio-top-btn svg {
            width: 30px;
            height: 30px;
            fill: #00ff88;
            transition: transform 0.3s linear;
        }

        .radio-top-btn.playing svg {
            animation: spinLeaf 3s linear infinite;
        }

        @keyframes spinLeaf {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Кнопка чата в правом верхнем углу (В виде молнии) */
        .chat-top-btn {
            position: fixed !important;
            top: 15px !important;
            right: 15px !important;
            z-index: 9999999 !important;
            width: 48px;
            height: 48px;
            background: #14141a;
            border: 2px solid #ffaa00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
            transition: 0.3s;
        }

        .chat-top-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.7);
        }

        .chat-top-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffaa00;
        }

        .wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            padding-bottom: 60px;
            position: relative;
            z-index: 5;
        }

        /* Баннер */
        .hero-banner {
            width: 90%;
            max-width: 800px;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Блок кнопок управления */
        .player-card {
            width: 90%;
            max-width: 500px;
            margin: 20px auto;
            position: relative;
            z-index: 10;
            background: rgba(20, 20, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        .player-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffaa00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            background: #ffaa00;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #e69900;
        }

        .action-btn.secondary {
            background: #2a2a36;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn.secondary:hover {
            background: #3b3b4a;
        }

        /* Окно чата (выпадает под кнопкой в правом верхнем углу) */
        .chat-card {
            position: fixed !important;
            top: 70px !important;
            right: 15px !important;
            z-index: 9999999 !important;
            width: 300px;
            background: #14141a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header h2 {
            font-size: 1rem;
            color: #fff;
        }

        .user-badge {
            font-size: 0.75rem;
            background: #2a2a36;
            color: #ffaa00;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .chat-messages {
            height: 200px;
            overflow-y: auto;
            background: #0d0d12;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-msg {
            font-size: 0.85rem;
            line-height: 1.3;
            word-break: break-word;
        }

        .chat-msg .author {
            color: #ffaa00;
            font-weight: bold;
            margin-right: 4px;
        }

        .chat-msg .time {
            font-size: 0.7rem;
            color: #666;
            margin-left: 6px;
        }

        .chat-input-area {
            display: flex;
            gap: 6px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            background: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .chat-input-area button {
            padding: 8px 12px;
            background: #ffaa00;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #181820;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-title {
            font-size: 1.2rem;
            color: #ffaa00;
            margin-bottom: 15px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Эффект цветомузыки по бокам -->
    <div class="music-visualizer-bg" id="musicVisualizer"></div>

    <!-- Аудио поток радио -->
    <audio id="radioPlayer" preload="none">
        <source src="https://dancewave.online/dance.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудиопроигрыватель.
    </audio>

    <!-- Кнопка Радио в левом верхнем углу (Анимированный детальный листок марихуаны) -->
    <div class="radio-top-btn" id="radioBtn" onclick="toggleRadio()" title="Включить / Выключить радио">
        <svg viewBox="0 0 24 24">
            <path d="M12,2C11.5,2 11,2.2 10.6,2.5C8.5,4 6.5,6.5 6,8.5C5.5,10.5 6,12.5 7,14C6,14.5 5,15 4,15.5C3,16 2.5,17 3,18C3.5,19 4.5,19.5 5.5,19C6.5,18.5 7.5,17.5 8.5,17C9,18 9.5,19 10,20C10.5,21 11.5,22 12.5,22C13.5,22 14.5,21 15,20C15.5,19 16,18 16.5,17C17.5,17.5 18.5,18.5 19.5,19C20.5,19.5 21.5,19 22,18C22.5,17 22,16 21,15.5C20,15 19,14.5 18,14C19,12.5 19.5,10.5 19,8.5C18.5,6.5 16.5,4 14.4,2.5C14,2.2 13.5,2 13,2H12M12,4.2C12.3,4.2 12.6,4.4 12.9,4.6C14.5,5.8 16.2,7.8 16.6,9.3C17,10.8 16.5,12.2 15.5,13.5C15.2,13.9 14.9,14.3 14.6,14.6C14.2,14.2 13.8,13.8 13.4,13.5C14.2,12.2 14.5,10.8 14.2,9.5C14,8.8 13.2,7.5 12,6.5C10.8,7.5 10,8.8 9.8,9.5C9.5,10.8 9.8,12.2 10.6,13.5C10.2,13.8 9.8,14.2 9.4,14.6C9.1,14.3 8.8,13.9 8.5,13.5C7.5,12.2 7,10.8 7.4,9.3C7.8,7.8 9.5,5.8 11.1,4.6C11.4,4.4 11.7,4.2 12,4.2Z"/>
        </svg>
    </div>

    <!-- Кнопка Чат в правом верхнем углу (В виде молнии) -->
    <div class="chat-top-btn" onclick="toggleChat()" title="Открыть чат">
        <svg viewBox="0 0 24 24">
            <path d="M11 15H6L13 2V9H18L11 22V15Z"/>
        </svg>
    </div>

    <div class="wrapper">
        <div class="hero-banner">
            <img src="https://raw.githubusercontent.com/ddevelop859-hue/-/44a1541bb99fd2168288254c875d13148e225176/images/1789038451964.png" alt="CS:GO Stream Banner">
        </div>

        <div class="player-card">
            <div class="player-title">Techno & Deep House Radio</div>
            <div class="btn-group">
                <button class="action-btn" onclick="openModal('donateModal')">Донат</button>
                <button class="action-btn secondary" id="authBtn" onclick="openModal('loginModal')">Кабинет</button>
            </div>
        </div>
    </div>

    <!-- Виджет чата (в правом верхнем углу) -->
    <div class="chat-card" id="chatCard">
        <div class="chat-header">
            <h2>Онлайн Чат</h2>
            <div class="user-badge" id="userBadge">ID: ...</div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg">
                <span class="author" style="color:#00ff88;">Система:</span> Чат активен!
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Модальное окно Доната -->
    <div class="modal-overlay" id="donateModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('donateModal')">✕</button>
            <div class="modal-title">Поддержать стримера</div>
            <div id="donateInfoText">
                <p style="color: #ccc; margin-bottom: 10px;">Реквизиты для перевода:</p>
                <div id="donateDetails" style="background: #0d0d12; padding: 12px; border-radius: 8px; font-family: monospace; color: #ffaa00;">
                    Данные доната пока не указаны.
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно Личного Кабинета -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('loginModal')">✕</button>
            
            <div id="loginForm">
                <div class="modal-title">Вход в личный кабинет</div>
                <input type="text" id="loginInput" class="modal-input" placeholder="Логин">
                <input type="password" id="passInput" class="modal-input" placeholder="Пароль">
                <button class="action-btn" style="width: 100%;" onclick="login()">Войти</button>
                <div id="loginError" style="color: #ff4444; font-size: 0.85rem; margin-top: 8px;"></div>
            </div>

            <div id="adminPanel" style="display: none;">
                <div class="modal-title">Панель управления (gruvik)</div>
                <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 8px;">Настройки реквизитов доната:</p>
                <textarea id="donateConfigInput" class="modal-input" rows="4" placeholder="Введите текст или реквизиты доната..."></textarea>
                <button class="action-btn" style="width: 100%; margin-bottom: 8px;" onclick="saveDonateSettings()">Сохранить</button>
                <button class="action-btn secondary" style="width: 100%;" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <script>
        const radioPlayer = document.getElementById('radioPlayer');
        const radioBtn = document.getElementById('radioBtn');
        const visualizer = document.getElementById('musicVisualizer');

        function toggleRadio() {
            if (radioPlayer.paused) {
                radioPlayer.play().then(() => {
                    radioBtn.classList.add('playing');
                    visualizer.classList.add('active');
                }).catch(e => console.log("Ошибка воспроизведения:", e));
            } else {
                radioPlayer.pause();
                radioBtn.classList.remove('playing');
                visualizer.classList.remove('active');
            }
        }

        const randomId = 'User_' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('userBadge').innerText = randomId;

        function toggleChat() {
            const chat = document.getElementById('chatCard');
            chat.style.display = (chat.style.display === 'flex') ? 'none' : 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text === '') return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<span class="author">${randomId}:</span> ${escapeHTML(text)} <span class="time">${timeStr}</span>`;

            const chatMessages = document.getElementById('chatMessages');
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function login() {
            const user = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (user === 'gruvik' && pass === '3535%tUr') {
                errorDiv.innerText = '';
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('authBtn').innerText = 'ЛК (gruvik)';
            } else {
                errorDiv.innerText = 'Неверный логин или пароль!';
            }
        }

        function logout() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('authBtn').innerText = 'Кабинет';
            document.getElementById('loginInput').value = '';
            document.getElementById('passInput').value = '';
            closeModal('loginModal');
        }

        function saveDonateSettings() {
            const val = document.getElementById('donateConfigInput').value;
            if (val.trim() !== '') {
                document.getElementById('donateDetails').innerText = val;
                alert('Настройки доната сохранены!');
                closeModal('loginModal');
            }
        }
    </script>
</body>
</html>
